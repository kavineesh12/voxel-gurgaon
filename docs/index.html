<div id="app">
      <canvas id="scene"></canvas>

      <div id="top-left">
        <h1>VOXEL GURGAON</h1>
        <div id="era-card">
          <div id="era-year">2025</div>
          <div id="era-text"></div>
        </div>
      </div>

      <div id="view-bar">
        <button class="view-btn" data-view="aerial">Aerial</button>
        <button class="view-btn active" data-view="straight">Straight</button>
        <button class="view-btn" data-view="eye">Eye level</button>
        <button class="view-btn" data-view="orbit">Orbit</button>
        <button id="labels" class="active" title="Toggle place labels">Labels</button>
        <button id="guide" title="Guided city tour">🧭 City Guide</button>
        <button id="directions-btn" title="From → To routes">🚗 Directions</button>
        <button id="daynight" title="Day / night">🌙</button>
      </div>

      <div id="timeline">
        <button class="era-btn" data-era="0">1920</button>
        <button class="era-btn" data-era="1">1940</button>
        <button class="era-btn" data-era="2">1960</button>
        <button class="era-btn" data-era="3">1980</button>
        <button class="era-btn" data-era="4">2000</button>
        <button class="era-btn" data-era="5">2010</button>
        <button class="era-btn" data-era="6">2020</button>
        <button class="era-btn active" data-era="7">NOW</button>
        <button id="play" title="Play through the decades">▶</button>
      </div>

      <div id="directions" class="hidden">
        <div id="dir-head">
          <span>Directions</span>
          <button id="dir-close">×</button>
        </div>
        <div class="dir-row">
          <span class="dir-dot from"></span>
          <input id="dir-from" list="places-list" placeholder="From — e.g. CyberCity" />
        </div>
        <div class="dir-row">
          <span class="dir-dot to"></span>
          <input id="dir-to" list="places-list" placeholder="To — e.g. Sector 4" />
        </div>
        <div class="dir-actions">
          <button id="dir-swap" title="Swap">⇅</button>
          <button id="dir-go">Find routes</button>
        </div>
        <div id="dir-traffic"></div>
        <div id="dir-results"></div>
        <div id="dir-api-note">
          Estimates from typical traffic. Live data would need: Google <b>Routes API</b> (traffic),
          <b>Places API</b> (venues), <b>Map Tiles API</b> (photoreal 3D).
        </div>
        <datalist id="places-list"></datalist>
      </div>

      <div id="info-card" class="hidden">
        <button id="info-close">×</button>
        <div id="info-name"></div>
        <div id="info-sub"></div>
        <div id="info-story"></div>
        <div id="info-pois"></div>
      </div>

      <div id="guide-card" class="hidden">
        <div id="guide-title"></div>
        <div id="guide-text"></div>
        <div id="guide-nav">
          <button id="guide-prev">← Back</button>
          <span id="guide-step"></span>
          <button id="guide-next">Next →</button>
          <button id="guide-end">End tour</button>
        </div>
      </div>

      <div id="hint">click a building or road for its history · drag to orbit · scroll to zoom</div>
    </div>
